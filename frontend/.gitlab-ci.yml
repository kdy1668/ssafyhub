stages:
  - build
  - deploy

variables:
  # AWS 기본 리전 설정
  AWS_DEFAULT_REGION: ap-northeast-2

# 1. 빌드 단계: Node.js 환경에서 코드를 압축하고 dist 폴더를 생성
build-frontend:
  stage: build
  image: node:20
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/ # 다음 단계로 넘겨줄 결과물 폴더
  only:
    - master # master 브랜치에 푸시될 때만 실행

# 2. 배포 단계: AWS CLI가 설치된 환경에서 S3 업로드 및 캐시 무효화
deploy-s3:
  stage: deploy
  image: amazon/aws-cli:latest
  dependencies:
    - build-frontend # 빌드 단계가 성공해야만 실행되고, dist 폴더를 물려받음
  script:
    # S3에 dist 폴더 내부 파일 업로드 (--delete 옵션으로 기존 파일 덮어쓰기)
    - aws s3 sync ./dist s3://$S3_BUCKET_NAME --delete
    # CloudFront 캐시 무효화로 새로운 화면 즉시 반영
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"
  only:
    - master