server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ssafyhub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

jwt:
  access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:1800000}
  refresh-token-expiration-millis: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:1209600000}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}

deployment:
  public-domain: ${DEPLOYMENT_PUBLIC_DOMAIN:ssafyhub.site}
  outbox:
    polling-delay-ms: ${DEPLOYMENT_OUTBOX_POLLING_DELAY_MS:5000}
    batch-size: ${DEPLOYMENT_OUTBOX_BATCH_SIZE:20}

devops:
  was:
    connect-timeout-ms: ${DEVOPS_WAS_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${DEVOPS_WAS_READ_TIMEOUT_MS:5000}

# AI 기능(배포 실패 진단 / 런타임 로그 이상 감지) 설정.
#
# SSAFY GMS(OpenAI 호환 프록시)를 사용한다. 키 이름을 OPENAI_API_KEY로 둔 것은
# GMS 발급 안내가 그 이름으로 내려주기 때문이다.
#
# enabled=false 이거나 api-key가 비어 있으면 AI 관련 빈이 생성되지 않고,
# 기존 기능은 전혀 영향받지 않는다.
ai:
  enabled: ${AI_ENABLED:false}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
  model: ${AI_MODEL:gpt-4.1}
  max-tokens: ${AI_MAX_TOKENS:4000}
  connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:60000}
  failure-diagnosis:
    max-log-lines: ${AI_DIAGNOSIS_MAX_LOG_LINES:400}
  runtime-log-detection:
    cooldown-seconds: ${AI_RUNTIME_LOG_COOLDOWN_SECONDS:30}
    tail: ${AI_RUNTIME_LOG_TAIL:300}
