spring:
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:mysql://localhost:3306/ssafyhub?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ssafyhub
    password: ssafyhub
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:ssafyhub-local-bucket}

security:
  encryption-key: ${SECRET_ENCRYPTION_KEY}
  cookie:
    secure: false

deployment:
  outbox:
    enabled: ${DEPLOYMENT_OUTBOX_ENABLED:false}

devops:
  was:
    base-url: ${DEVOPS_WAS_BASE_URL:http://localhost:8081}
