spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

jwt:
  secret: ${JWT_SECRET}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}

security:
  encryption-key: ${SECRET_ENCRYPTION_KEY}
  cookie:
    secure: true

deployment:
  outbox:
    enabled: ${DEPLOYMENT_OUTBOX_ENABLED:true}

devops:
  was:
    base-url: ${DEVOPS_WAS_BASE_URL}
