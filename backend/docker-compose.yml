services:
  mysql:
    image: mysql:8.4
    container_name: ssafyhub-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ssafyhub
      MYSQL_USER: ssafyhub
      MYSQL_PASSWORD: ssafyhub
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ssafyhub-mysql-data:/var/lib/mysql

volumes:
  ssafyhub-mysql-data:
